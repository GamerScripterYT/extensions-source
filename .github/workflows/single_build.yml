name: Build Single Extension

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension path (e.g., src/en/chikari)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build extension
        run: ./gradlew $(echo "${{ inputs.extension }}" | sed 's|/|:|g'):assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chikari-apk
          path: ${{ inputs.extension }}/build/outputs/apk/debug/*.apk
          retention-days: 7
