name: Build and Deploy Mihon Extension Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Extensions and Generator Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Repo Output
        run: |
          mkdir -p output/apk

          # Copy any APK files if present
          find . -maxdepth 4 -name "*.apk" -not -path "./output/*" -exec cp {} output/apk/ \; || true

          # Create repo.json
          cat << 'EOF' > output/repo.json
          {
            "name": "GamerScripterYT Extensions",
            "website": "https://github.com/GamerScripterYT/extensions-source",
            "signingKeyFingerprint": ""
          }
          EOF

          # Generate index.json and index.min.json
          python3 - << 'EOF'
          import json, os, glob

          extensions = [
              {
                  "name": "Chikari",
                  "pkg": "eu.kanade.tachiyomi.extension.en.chikari",
                  "apk": "tachiyomi-en.chikari-v1.apk",
                  "lang": "en",
                  "code": 1,
                  "version": "1.4.0",
                  "nsfw": 0,
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "sources": [
                      {
                          "name": "Chikari",
                          "id": "1849204918239102",
                          "baseUrl": "https://chikari.moe",
                          "lang": "en"
                      }
                  ]
              }
          ]

          with open('output/index.json', 'w', encoding='utf-8') as f:
              json.dump(extensions, f, indent=2)

          with open('output/index.min.json', 'w', encoding='utf-8') as f:
              json.dump(extensions, f, separators=(',', ':'))

          print("Generated index files successfully!")
          EOF

      - name: Deploy files to repo branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b repo
          git add -A
          git commit -m "Auto-generate Mihon repo indexes and APKs [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
